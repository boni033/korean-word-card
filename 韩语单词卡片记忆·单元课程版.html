<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>韩语单词卡片记忆·单元课程版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;}
:root{--primary:#4299e1;--primary-dark:#3182ce;--bg:#f0f4f8;--card:#fff;--text:#2d3748;--muted:#718096;--light:#a0aec0;}
body{background:var(--bg);padding:16px;max-width:680px;margin:0 auto;padding-bottom:60px;}
h1{text-align:center;color:var(--text);margin-bottom:6px;font-size:22px;}
.subtitle{text-align:center;color:var(--muted);font-size:13px;margin-bottom:14px;}

/* 输入区 */
.input-section{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 2px 8px #0000000d;margin-bottom:14px;}
.group-row{display:flex;gap:10px;margin-bottom:10px;}
.group-row label{font-size:13px;color:var(--muted);white-space:nowrap;line-height:36px;}
.group-row input{flex:1;padding:8px 10px;border:1px solid #cbd5e0;border-radius:8px;font-size:14px;min-width:0;}
textarea{width:100%;height:120px;padding:10px;border:1px solid #cbd5e0;border-radius:8px;font-size:14px;resize:none;font-family:inherit;}
.btn-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
button{padding:9px 14px;border:none;border-radius:8px;font-size:14px;cursor:pointer;transition:background .15s;}
button:disabled{background:#a0aec0;cursor:not-allowed;opacity:.6;}
.btn-primary{background:var(--primary);color:#fff;} .btn-primary:hover{background:var(--primary-dark);}
.btn-ghost{background:#edf2f7;color:var(--text);} .btn-ghost:hover{background:#e2e8f0;}
.btn-green{background:#48bb78;color:#fff;} .btn-green:hover{background:#38a169;}
.btn-red{background:#e53e3e;color:#fff;} .btn-red:hover{background:#c53030;}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;}

/* 课程列表 */
.lesson-section{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 2px 8px #0000000d;margin-bottom:14px;}
.lesson-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.lesson-list{display:flex;flex-wrap:wrap;gap:8px;}
.lesson-chip{padding:6px 12px;background:#edf2f7;border-radius:20px;font-size:13px;cursor:pointer;color:var(--text);border:1px solid transparent;}
.lesson-chip:hover{background:#e2e8f0;}
.lesson-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.lesson-chip .del{color:var(--light);margin-left:6px;font-size:12px;} .lesson-chip.active .del{color:#fff;}
.empty-lessons{color:var(--light);font-size:13px;}

/* 卡片区 */
.card-wrap{position:relative;margin-bottom:12px;}
.card-container{position:relative;overflow:hidden;border-radius:16px;background:var(--card);box-shadow:0 4px 16px #00000014;height:360px;}
.card-track{display:flex;height:100%;transition:transform .35s ease-out;}
.word-card{min-width:100%;height:100%;padding:22px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;user-select:none;}
.hangul{font-size:52px;font-weight:bold;color:var(--primary);cursor:pointer;margin-bottom:6px;transition:transform .1s;}
.hangul:active{transform:scale(.95);}
.roman{font-size:21px;color:var(--muted);margin-bottom:8px;}
.answer-block{opacity:1;transition:opacity .3s;display:flex;flex-direction:column;align-items:center;}
.prop{font-size:15px;color:#805ad5;margin-bottom:4px;}
.hanja{font-size:18px;color:#b45309;margin-bottom:10px;}
.mean{font-size:27px;color:var(--text);font-weight:600;}
.hidden-answer .answer-block{opacity:0;pointer-events:none;}
.recall-tip{font-size:14px;color:var(--light);margin-top:10px;}
.empty-state{display:flex;align-items:center;justify-content:center;height:100%;color:var(--light);font-size:15px;text-align:center;padding:20px;line-height:1.8;}

/* 状态栏 & 控制 */
.status-bar{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:10px;padding:8px 12px;box-shadow:0 2px 6px #0000000d;margin-bottom:10px;}
.page-info{font-size:14px;color:var(--muted);font-weight:600;}
.mark-stats{font-size:12px;color:var(--muted);}
.controls{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 2px 8px #0000000d;margin-bottom:12px;}
.ctrl-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px;}
.ctrl-row:last-child{margin-bottom:0;}
.ctrl-group{display:flex;align-items:center;gap:6px;background:#f7fafc;border-radius:8px;padding:4px 8px;}
.ctrl-label{font-size:12px;color:var(--muted);}
select{padding:5px 8px;border:1px solid #cbd5e0;border-radius:6px;font-size:13px;background:#fff;}
.mark-row{display:flex;justify-content:center;gap:10px;margin-top:8px;}
.mark-btn{padding:7px 14px;border-radius:20px;font-size:13px;border:none;cursor:pointer;}
.mark-btn.know{background:#c6f6d5;color:#22543d;} .mark-btn.know.active{background:#48bb78;color:#fff;}
.mark-btn.fuzzy{background:#feebc8;color:#7b341e;} .mark-btn.fuzzy.active{background:#ed8936;color:#fff;}
.mark-btn.noknow{background:#fed7d7;color:#742a2a;} .mark-btn.noknow.active{background:#e53e3e;color:#fff;}

/* 速听面板 */
.quick-panel{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 2px 8px #0000000d;margin-bottom:12px;display:none;}
.quick-panel.show{display:block;}
.quick-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.quick-head b{font-size:14px;color:var(--text);}
.quick-controls{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;}
.quick-controls label{font-size:13px;color:var(--muted);}
.now-playing{text-align:center;font-size:15px;color:var(--primary);margin-top:8px;font-weight:600;min-height:22px;}

/* 快捷键提示 */
.hotkey-tip{text-align:center;color:var(--light);font-size:12px;margin-top:10px;line-height:1.8;}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#2d3748;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;z-index:99;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<h1>📚 韩语单词卡片记忆</h1>
<div class="subtitle">单元课程分组 · 自动罗马音 · 发音速听 · 自测生词标记</div>

<!-- 输入区 -->
<div class="input-section">
  <div class="group-row">
    <label>单元</label>
    <input id="unitInput" placeholder="例：1 或 제1과" style="max-width:80px;">
    <label>第几课</label>
    <input id="lessonInput" placeholder="例：1 或 1과">
  </div>
  <textarea id="inputArea" placeholder="粘贴本课单词，格式：
문 (名) [門] 门
창문 (名) [窓門] 窗户
지도 (名) [地圖] 地图
칠판(名) [漆板] 黑板"></textarea>
  <div class="btn-row">
    <button class="btn-primary" id="saveBtn">保存为本课单词</button>
    <button class="btn-ghost" id="clearInputBtn">清空输入</button>
  </div>
</div>

<!-- 课程列表 -->
<div class="lesson-section">
  <div class="lesson-title">
    <span>我的课程</span>
    <button class="btn-ghost btn-sm" id="exportBtn">导出备份</button>
  </div>
  <div class="lesson-list" id="lessonList">
    <span class="empty-lessons">还没有课程，先在上方输入单元/课并粘贴单词保存吧</span>
  </div>
</div>

<!-- 状态栏 -->
<div class="status-bar">
  <span class="page-info" id="pageInfo">0 / 0</span>
  <span class="mark-stats" id="markStats"></span>
</div>

<!-- 卡片 -->
<div class="card-wrap">
  <div class="card-container">
    <div class="card-track" id="track">
      <div class="empty-state">选择左侧课程 → 查看单词卡片<br>点击韩文播放读音<br>左右滑动 / 按钮切换</div>
    </div>
  </div>
</div>

<!-- 标记 -->
<div class="mark-row">
  <button class="mark-btn know" data-mark="know">✅ 掌握</button>
  <button class="mark-btn fuzzy" data-mark="fuzzy">⚠️ 模糊</button>
  <button class="mark-btn noknow" data-mark="noknow">❌ 不认识</button>
</div>

<!-- 控制区 -->
<div class="controls">
  <div class="ctrl-row">
    <div class="ctrl-group">
      <span class="ctrl-label">语速</span>
      <select id="rateSelect"><option value="0.7">慢速 0.7</option><option value="0.9" selected>正常 0.9</option><option value="1.1">快速 1.1</option></select>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">筛选</span>
      <select id="filterSelect">
        <option value="all">全部单词</option>
        <option value="noknow">只看不认识</option>
        <option value="fuzzy">只看模糊</option>
        <option value="review">生词复习(模糊+不认识)</option>
      </select>
    </div>
    <button class="btn-ghost btn-sm" id="shuffleBtn">🔀 乱序</button>
    <button class="btn-ghost btn-sm" id="selfTestBtn">🔍 自测模式</button>
    <button class="btn-ghost btn-sm" id="romanToggleBtn">罗马音:开</button>
  </div>
  <div class="ctrl-row">
    <button class="btn-ghost" id="prevBtn" disabled>◀ 上一个</button>
    <button class="btn-green" id="quickPlayBtn">▶ 速听本课</button>
    <button class="btn-ghost" id="nextBtn" disabled>下一个 ▶</button>
  </div>
</div>

<!-- 速听面板 -->
<div class="quick-panel" id="quickPanel">
  <div class="quick-head"><b>🎧 单词速听</b><button class="btn-red btn-sm" id="stopQuickBtn">■ 停止</button></div>
  <div class="quick-controls">
    <label>间隔
      <select id="intervalSelect"><option value="2000">2秒</option><option value="3000" selected>3秒</option><option value="4000">4秒</option><option value="5000">5秒</option></select>
    </label>
    <label><input type="checkbox" id="blindMode"> 盲听(只出声不显示)</label>
  </div>
  <div class="now-playing" id="nowPlaying"></div>
</div>

<div class="hotkey-tip">快捷键：← 上一个 · → 下一个 · 空格 播放读音 · S 自测模式</div>

<div class="toast" id="toast"></div>

<script>
/* ========== 1. 罗马音转换 ========== */
const hangulRomanMap=(()=>{
const init={'ㄱ':'g','ㄲ':'kk','ㄴ':'n','ㄷ':'d','ㄸ':'tt','ㄹ':'r','ㅁ':'m','ㅂ':'b','ㅃ':'pp','ㅅ':'s','ㅆ':'ss','ㅇ':'','ㅈ':'j','ㅉ':'jj','ㅊ':'ch','ㅋ':'k','ㅌ':'t','ㅍ':'p','ㅎ':'h'};
const mid={'ㅏ':'a','ㅐ':'ae','ㅑ':'ya','ㅒ':'yae','ㅓ':'eo','ㅔ':'e','ㅕ':'yeo','ㅖ':'ye','ㅗ':'o','ㅘ':'wa','ㅙ':'wae','ㅚ':'oe','ㅛ':'yo','ㅜ':'u','ㅝ':'wo','ㅞ':'we','ㅟ':'wi','ㅠ':'yu','ㅡ':'eu','ㅢ':'ui','ㅣ':'i'};
const fin={'':'','ㄱ':'k','ㄲ':'k','ㄳ':'k','ㄴ':'n','ㄵ':'n','ㄶ':'n','ㄷ':'t','ㄹ':'l','ㄺ':'l','ㄻ':'l','ㄼ':'l','ㄽ':'l','ㄾ':'l','ㄿ':'l','ㅀ':'l','ㅁ':'m','ㅂ':'p','ㅄ':'p','ㅅ':'t','ㅆ':'t','ㅇ':'ng','ㅈ':'t','ㅊ':'t','ㅋ':'k','ㅌ':'t','ㅍ':'p','ㅎ':'t'};
return{init,mid,fin};
})();
function koreanToRoman(str){
if(!str)return'';
const{init,mid,fin}=hangulRomanMap;
let out='';
for(const ch of str){
const c=ch.charCodeAt(0);
if(c<0xAC00||c>0xD7A3){out+=ch;continue;}
const off=c-0xAC00;
const i=Math.floor(off/(21*28)),m=Math.floor((off%(21*28))/28),f=off%28;
out+=init[Object.keys(init)[i]]+mid[Object.keys(mid)[m]]+fin[Object.keys(fin)[f]];
}
return out;
}

/* ========== 2. TTS发音 ========== */
function speak(text){
if(!window.speechSynthesis)return toast('当前浏览器不支持语音');
speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(text);
u.lang='ko-KR';
u.rate=parseFloat(rateSelect.value);
speechSynthesis.speak(u);
}

/* ========== 3. 解析格式 ========== */
function parseLine(line){
let hangul='',prop='',hanja='',meaning='';
const m=line.match(/^(.*?)\s*\(([^)]+)\)/);
if(m){
hangul=m[1].trim();prop=m[2].trim();
const rest=line.slice(m[0].length);
const hj=rest.match(/\[(.*?)\]/);
if(hj){hanja=hj[1].trim();meaning=rest.slice(hj[0].length).trim();}
else meaning=rest.trim();
}else meaning=line.trim();
if(!hangul&&!meaning){return null;}
if(!hangul){hangul=meaning.split(/[\s,，、]/)[0]||'';}
return{hangul,prop,hanja,meaning,mark:null,id:Date.now()+Math.random()};
}

/* ========== 4. 数据存储 ========== */
const STORE_KEY='koreanWordLessons_v1';
let lessons=load();
function load(){
try{return JSON.parse(localStorage.getItem(STORE_KEY))||[];}
catch(e){return[];}
}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(lessons));}
function lessonKey(u,l){return `${u||'?'}-${l||'?'}`;}

/* ========== 5. 全局状态 ========== */
let currentLesson=null;   // lessons里的对象引用
let wordList=[];          // 当前显示列表（可能是筛选后）
let fullList=[];          // 当前课全部单词
let currentIndex=0;
let selfTest=false;
let showRoman=true;
let shuffled=false;

/* ========== DOM ========== */
const $=id=>document.getElementById(id);
const inputArea=$('inputArea'),unitInput=$('unitInput'),lessonInput=$('lessonInput');
const track=$('track'),pageInfo=$('pageInfo'),markStats=$('markStats');
const prevBtn=$('prevBtn'),nextBtn=$('nextBtn'),lessonList=$('lessonList');
const rateSelect=$('rateSelect'),filterSelect=$('filterSelect');
const quickPanel=$('quickPanel'),nowPlaying=$('nowPlaying');
const toastEl=$('toast');

let toastTimer;
function toast(msg){
toastEl.textContent=msg;toastEl.classList.add('show');
clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1500);
}

/* ========== 6. 课程列表渲染 ========== */
function renderLessons(){
if(lessons.length===0){
lessonList.innerHTML='<span class="empty-lessons">还没有课程，先在上方输入单元/课并粘贴单词保存吧</span>';
return;
}
lessonList.innerHTML='';
lessons.forEach((ls,idx)=>{
const chip=document.createElement('span');
const isActive=currentLesson&&ls.key===currentLesson.key;
chip.className='lesson-chip'+(isActive?' active':'');
chip.innerHTML=`${ls.unit||'?'} · ${ls.lesson||'?'}课 <span class="del" data-idx="${idx}">✕</span>`;
chip.onclick=e=>{
if(e.target.classList.contains('del'))return;
selectLesson(idx);
};
chip.querySelector('.del').onclick=e=>{
e.stopPropagation();
if(confirm(`删除「${ls.unit||'?'} · ${ls.lesson||'?'}课」及其中${ls.words.length}个单词？`)){
lessons.splice(idx,1);save();
if(currentLesson===ls){currentLesson=null;wordList=[];fullList=[];currentIndex=0;}
renderLessons();renderCardArea();
}
};
lessonList.appendChild(chip);
});
}
function selectLesson(idx){
currentLesson=lessons[idx];
fullList=currentLesson.words.slice();
applyFilter();
renderLessons();renderCardArea();
toast(`已加载「${currentLesson.unit||'?'} · ${currentLesson.lesson||'?'}课」${fullList.length}个单词`);
}

/* ========== 7. 筛选 / 乱序 ========== */
function applyFilter(){
let src=shuffled?shuffleCopy(fullList):fullList.slice();
const f=filterSelect.value;
if(f==='noknow')src=src.filter(w=>w.mark==='noknow');
else if(f==='fuzzy')src=src.filter(w=>w.mark==='fuzzy');
else if(f==='review')src=src.filter(w=>w.mark==='noknow'||w.mark==='fuzzy');
wordList=src;
if(currentIndex>=wordList.length)currentIndex=wordList.length-1;
if(currentIndex<0)currentIndex=0;
renderCardArea();
}
function shuffleCopy(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ========== 8. 卡片渲染 ========== */
function renderCardArea(){
if(wordList.length===0){
track.innerHTML=`<div class="empty-state">${currentLesson?('该课暂无匹配的单词<br>试试切换筛选条件') :'先选择左侧的课程，或输入单词保存'}</div>`;
pageInfo.textContent='0 / 0';markStats.textContent='';
updateNav();
return;
}
track.innerHTML='';
wordList.forEach(w=>{
const card=document.createElement('div');
card.className='word-card'+(selfTest?' hidden-answer':'');
card.innerHTML=`
<div class="hangul">${w.hangul}</div>
<div class="roman" style="display:${showRoman?'block':'none'}">${w.roman||koreanToRoman(w.hangul)}</div>
<div class="answer-block">
  <div class="prop">${w.prop||''}</div>
  <div class="hanja">${w.hanja?'['+w.hanja+']':''}</div>
  <div class="mean">${w.meaning||''}</div>
</div>
${selfTest?'<div class="recall-tip">点击卡片显示答案</div>':''}
`;
const hangul=card.querySelector('.hangul');
hangul.onclick=()=>speak(w.hangul);
card.addEventListener('click',()=>{
if(selfTest)card.classList.remove('hidden-answer');
});
track.appendChild(card);
});
goIndex(currentIndex,true);
}

function goIndex(idx,force){
if(wordList.length===0){updateNav();return;}
if(idx<0)idx=0;if(idx>=wordList.length)idx=wordList.length-1;
currentIndex=idx;
track.style.transform=`translateX(-${currentIndex*100}%)`;
updateNav();
markStats.textContent=statsText();
}

function statsText(){
if(!currentLesson)return'';
const w=currentLesson.words;
const k=w.filter(x=>x.mark==='know').length;
const fu=w.filter(x=>x.mark==='fuzzy').length;
const n=w.filter(x=>x.mark==='noknow').length;
return `✅${k} ⚠️${fu} ❌${n} / 共${w.length}`;
}
function updateNav(){
pageInfo.textContent=`${wordList.length?currentIndex+1:0} / ${wordList.length}`;
prevBtn.disabled=currentIndex<=0;
nextBtn.disabled=currentIndex>=wordList.length-1;
}

/* ========== 9. 标记 ========== */
function markWord(mark){
if(!wordList.length||!currentLesson)return;
const w=wordList[currentIndex];
w.mark=(w.mark===mark?null:mark);
// 同步到全量列表
const orig=currentLesson.words.find(x=>x.id===w.id);
if(orig)orig.mark=w.mark;
save();
markStats.textContent=statsText();
updateMarkBtns();
}
function updateMarkBtns(){
if(!wordList.length){document.querySelectorAll('.mark-btn').forEach(b=>b.classList.remove('active'));return;}
const m=wordList[currentIndex].mark;
document.querySelectorAll('.mark-btn').forEach(b=>b.classList.toggle('active',b.dataset.mark===m));
}
document.querySelectorAll('.mark-btn').forEach(b=>b.onclick=()=>markWord(b.dataset.mark));

/* ========== 10. 事件绑定 ========== */
$('saveBtn').onclick=()=>{
const unit=unitInput.value.trim(),lesson=lessonInput.value.trim();
if(!unit&&!lesson){toast('请填写单元和课数');return;}
const raw=inputArea.value.trim();
if(!raw){toast('请粘贴本课单词');return;}
const words=[];
raw.split(/\r?\n/).forEach(line=>{
line=line.trim();if(!line)return;
const w=parseLine(line);
if(w)words.push(w);
});
if(!words.length){toast('未解析到有效单词');return;}
words.forEach(w=>w.roman=koreanToRoman(w.hangul));
const key=lessonKey(unit,lesson);
let ls=lessons.find(x=>x.key===key);
if(ls){ls.words.push(...words);toast(`已追加到「${unit}·${lesson}课」，现有${ls.words.length}词`);}
else{ls={key,unit,lesson,words};lessons.push(ls);toast(`已保存「${unit}·${lesson}课」${words.length}词`);}
save();
renderLessons();
// 若正显示该课，刷新
if(currentLesson&&currentLesson.key===key){currentLesson=ls;fullList=ls.words.slice();applyFilter();}
inputArea.value='';
};
$('clearInputBtn').onclick=()=>{inputArea.value='';unitInput.value='';lessonInput.value='';};

prevBtn.onclick=()=>goIndex(currentIndex-1);
nextBtn.onclick=()=>goIndex(currentIndex+1);

$('shuffleBtn').onclick=()=>{
if(!fullList.length){toast('先选择一课');return;}
shuffled=!shuffled;
$('shuffleBtn').textContent=shuffled?'🔀 恢复顺序':'🔀 乱序';
applyFilter();
toast(shuffled?'已打乱顺序':'已恢复顺序');
};
$('selfTestBtn').onclick=()=>{
selfTest=!selfTest;
$('selfTestBtn').textContent=selfTest?'🔍 退出自测':'🔍 自测模式';
renderCardArea();
toast(selfTest?'自测模式：先回忆，点卡片显示答案':'已退出自测');
};
$('romanToggleBtn').onclick=()=>{
showRoman=!showRoman;
$('romanToggleBtn').textContent=showRoman?'罗马音:开':'罗马音:关';
renderCardArea();
};
filterSelect.onchange=()=>applyFilter();

/* ========== 11. 速听模式 ========== */
let quickTimer=null;
$('quickPlayBtn').onclick=()=>{
if(!currentLesson){toast('先选择一课');return;}
const pool=wordList.length?wordList:fullList;
if(!pool.length){toast('没有可速听的单词');return;}
quickPanel.classList.add('show');
$('stopQuickBtn').textContent='■ 停止';
if(shuffled&&currentIndex>0)goIndex(0);
quickPlayTick(pool,0);
};
function quickPlayTick(pool,i){
if(i>=pool.length){stopQuick();toast('速听完成');return;}
const w=pool[i];
if(!$('blindMode').checked){goIndex(wordList.indexOf(w)>=0?wordList.indexOf(w):0);}
nowPlaying.textContent=w.hangul+' · '+w.meaning;
speak(w.hangul);
quickTimer=setTimeout(()=>quickPlayTick(pool,i+1),parseInt($('intervalSelect').value));
}
function stopQuick(){
clearTimeout(quickTimer);quickTimer=null;
quickPanel.classList.remove('show');
nowPlaying.textContent='';
$('stopQuickBtn').textContent='■ 停止';
}
$('stopQuickBtn').onclick=stopQuick;

/* ========== 12. 触摸滑动 ========== */
let tsx=0;
track.addEventListener('touchstart',e=>{tsx=e.touches[0].clientX;},{passive:true});
track.addEventListener('touchend',e=>{
if(!wordList.length)return;
const dx=e.changedTouches[0].clientX-tsx;
if(dx>65)goIndex(currentIndex-1);
else if(dx<-65)goIndex(currentIndex+1);
},{passive:true});

/* ========== 13. 键盘快捷键 ========== */
document.addEventListener('keydown',e=>{
if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
if(e.code==='ArrowLeft'){goIndex(currentIndex-1);e.preventDefault();}
else if(e.code==='ArrowRight'){goIndex(currentIndex+1);e.preventDefault();}
else if(e.code==='Space'){if(wordList.length){speak(wordList[currentIndex].hangul);e.preventDefault();}}
else if(e.key.toLowerCase()==='s'){$('selfTestBtn').click();}
});

/* ========== 14. 导出备份 ========== */
$('exportBtn').onclick=()=>{
if(!lessons.length){toast('暂无数据');return;}
let txt='===== 韩语单词备份 =====\n\n';
lessons.forEach(ls=>{
txt+=`【${ls.unit||'?'} · ${ls.lesson||'?'}课】共${ls.words.length}词\n`;
ls.words.forEach(w=>{
const m=w.mark==='know'?'[掌握]':w.mark==='fuzzy'?'[模糊]':w.mark==='noknow'?'[不认识]':'';
txt+=`${w.hangul} ${w.prop?'('+w.prop+') ':''}${w.hanja?'['+w.hanja+'] ':''}${w.meaning} ${m}\n`;
});
txt+='\n';
});
const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='韩语单词备份.txt';
a.click();
URL.revokeObjectURL(a.href);
toast('已导出备份文本');
};

/* ========== 初始化 ========== */
renderLessons();
renderCardArea();
</script>
</body>
